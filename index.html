<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Manbar Gold - Generator Khotbah Jumat 52 Minggu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-dark: #051b11;
            --bg-card: #0d2818;
            --gold-primary: #dfa832;
            --gold-light: #f3e08c;
            --gold-dark: #9a741c;
            --text-light: #f0f4f1;
            --text-muted: #a3b899;
            --border-gold: rgba(223, 168, 50, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, #133a23 0%, var(--bg-dark) 70%);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HEADER & BADGE */
        header {
            text-align: center;
            padding: 30px 10px;
            border-bottom: 2px solid var(--border-gold);
            margin-bottom: 25px;
            position: relative;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .developer-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 40, 24, 0.8);
            border: 1px solid var(--border-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--gold-light);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            position: relative;
        }

        .live-dot::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: rgba(255, 59, 48, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* FILTER & FORM CARD */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--gold-light);
            font-weight: 600;
        }

        .form-control {
            background-color: rgba(5, 27, 17, 0.8);
            border: 1px solid var(--border-gold);
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 8px rgba(243, 224, 140, 0.3);
        }

        /* 3D BUTTONS WITH LIGHT SWEEP */
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-3d {
            position: relative;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%);
            color: #051b11;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 5px 0 var(--gold-dark), 0 8px 15px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--gold-dark), 0 3px 6px rgba(0,0,0,0.4);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #2a5235 0%, #14331c 100%);
            color: var(--gold-light);
            box-shadow: 0 5px 0 #09170d, 0 8px 15px rgba(0,0,0,0.4);
        }

        /* Light Sweep Effect */
        .btn-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-25deg);
            animation: sweep 3s infinite;
        }

        @keyframes sweep {
            0% { left: -100%; }
            30% { left: 200%; }
            100% { left: 200%; }
        }

        /* TAB NAVIGATION */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-gold);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--gold-light);
            border-bottom-color: var(--gold-primary);
        }

        /* KHOTBAH CONTENT VIEW */
        .khotbah-display {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 30px;
            line-height: 1.8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .khotbah-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-gold);
        }

        .khotbah-header h2 {
            color: var(--gold-light);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .khotbah-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            direction: rtl;
            text-align: right;
            line-height: 2.3;
            color: #ffffff;
            background: rgba(5, 27, 17, 0.6);
            padding: 18px;
            border-radius: 8px;
            border-right: 4px solid var(--gold-primary);
            margin: 15px 0;
        }

        .latin-text {
            font-style: italic;
            color: var(--gold-light);
            margin-bottom: 5px;
        }

        .translation {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .section-title {
            color: var(--gold-primary);
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
            }
            .no-print, header, .card, .btn-container, .tab-container {
                display: none !important;
            }
            .khotbah-display {
                border: none !important;
                box-shadow: none !important;
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
            }
            .arabic-text {
                background: none !important;
                color: #000 !important;
                border-right: 2px solid #000 !important;
            }
            .latin-text, .section-title, .khotbah-header h2 {
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">Al-Manbar Gold Edition</h1>
        <p class="subtitle">Generator Khotbah Jumat Lengkap Momen 1 Tahun (52 Judul)</p>
        <div class="developer-badge">
            <span class="live-dot"></span>
            <span>developer: fatur62</span>
        </div>
    </header>

    <!-- FILTER CARD -->
    <div class="card no-print">
        <div class="form-grid">
            <div class="form-group">
                <label for="selectBulan">Pilih Bulan (1 - 12)</label>
                <select id="selectBulan" class="form-control" onchange="loadKhotbah()">
                    <!-- Populated by JS -->
                </select>
            </div>
            <div class="form-group">
                <label for="selectMinggu">Pilih Minggu (1 - 5)</label>
                <select id="selectMinggu" class="form-control" onchange="loadKhotbah()">
                    <option value="1">Minggu 1</option>
                    <option value="2">Minggu 2</option>
                    <option value="3">Minggu 3</option>

                </select>

            <div class="form-group">

            </div>
            <div class="form-group">

    <!-- MAIN DISPLAY AREA -->

<script>
// === DATABASE 52 KHOTBAH (SIMULATOR & GENERATOR ENGINE) ===
const monthNames = [
    "Januari (Aqidah & Tauhid)", "Februari (Tazkiyatun Nufs)", "Maret (Akhlak & Adab)", 
    "April (Keluarga & Pemuda)", "Mei (Muamalah & Ekonomi)", "Juni (Ramadhan & Puasa)",
    "Juli (Qurban & Dzulhijjah)", "Agustus (Tahun Baru Islam & Hijrah)", "September (Maulid & Sunnah)",
    "Oktober (Sosial & Kedamaian)", "November (Sains & Ilmu)", "Desember (Muhasabah & Akhirat)"
];

// Generator function untuk menghasilkan 52 judul beserta materi arab utuh
function generate52Database() {
    const db = [];
    let globalIndex = 1;

    const baseTitles = [
        // Bulan 1
        "Memperbarui Hakikat Syahadat di Era Modern", "Murni-nya Tauhid: Menjauhi Syirik Khofi", "Mengenal Allah Lewat Asmaul Husna", "Menjaga Keikhlasan Hati dari Riya'",
        // Bulan 2
        "Hakikat Taubat Nasuha dan Istighfar", "Mengobati Penyakit Dengki (Hasad) dan Sombong", "Bahaya Lidah: Menjaga Lisan dari Fitnah", "Mengelola Amarah Menurut Petunjuk Nabi",
        // Bulan 3
        "Berbakti kepada Kedua Orang Tua (Birrul Walidain)", "Mempererat Tali Silaturahmi Bertetangga", "Islam dan Sikap Toleransi (Tasamuh)", "Amanah dan Kejujuran dalam Bekerja",
        // Bulan 4
        "Membangun Rumah Tangga Mawaddah Rahmah", "Tanggung Jawab Orang Tua di Era Digital", "Pemuda Islam: Meneladani Ashabul Kahfi", "Adab Berinteraksi dalam Muamalah",
        // Bulan 5
        "Konsep Rezeki Berkah dalam Islam", "Bahaya Riba dan Keutamaan Transaksi Syariah", "Keutamaan Sedekah, Zakat, dan Wakaf", "Menjauhi Harta dan Makanan Haram",
        // Bulan 6
        "Persiapan Ruhiyah Menyambut Ramadhan", "Meraih Derajat Taqwa Melalui Puasa", "Menggapai Kemuliaan Malam Lailatul Qadar", "Merawat Konsistensi Ibadah Pasca-Ramadhan",
        // Bulan 7
        "Meneladani Ketauhidan Nabi Ibrahim AS", "Makna Hakiki Kurban Mengorbankan Nafsu", "Keutamaan 10 Hari Pertama Dzulhijjah", "Menjaga Kualitas Shalat Khusyu'",
        // Bulan 8
        "Makna Hijrah Jiwa di Era Milenial", "Muhasabah Diri Sebelum Waktu Hisab", "Menghargai Waktu Sebagai Modal Utama", "Menghadapi Ujian dengan Sabar dan Ridha",
        // Bulan 9
        "Keagungan Akhlak Rasulullah SAW", "Menjadikan Sunnah Nabi Sebagai Gaya Hidup", "Keutamaan Memperbanyak Shalawat", "Kepemimpinan Nabi: Cermin Keadilan",
        // Bulan 10
        "Peran Umat Islam Menjaga Kedamaian Bangsa", "Islam dan Kelestarian Lingkungan Hidup", "Pentingnya Menjaga Keadilan dan Menolak Zalim", "Menumbuhkan Empati Kepada Sesama",
        // Bulan 11
        "Kedudukan Ilmu dan Ulama dalam Islam", "Menjaga Kesehatan Fisik dan Mental", "Harmoni Iman, Ilmu, dan Teknologi", "Kebersihan Sebagian Dari Iman",
        // Bulan 12
        "Mengingat Kematian (Zikrul Maut)", "Bekal Terbaik Menuju Alam Barzakh", "Gambaran Hari Kiamat dan Hari Pembalasan", "Mengenal Kenikmatan Surga dan Siksa Neraka", "Istiqamah Hingga Husnul Khatimah"
    ];

    for (let bulan = 1; bulan <= 12; bulan++) {
        const weeksInMonth = (bulan === 12) ? 5 : 4;
        for (let minggu = 1; minggu <= weeksInMonth; minggu++) {
            const judul = baseTitles[globalIndex - 1] || `Khotbah Tematik Minggu ke-${globalIndex}`;
            
            db.push({
                id: globalIndex,
                bulan: bulan,
                minggu: minggu,
                judul: judul,
                khotbah_pertama: {
                    muqaddimah: "الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا لِهَذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلَا أَنْ هَدَانَا اللَّهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيْكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ لاَ نَبِيَّ بَعْدَهُ.",
                    wasiat_taqwa: "فَيَا أَيُّهَا الْحَاضِرُوْنَ، أُوْصِيْكُمْ وَنَفْسِيْ بِتَقْوَى اللهِ فَقَدْ فَازَ الْمُتَّقُوْنَ. قَالَ اللهُ تَعَالَى: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ.",
                    isi: [
                        `Jamaah Shalat Jumat yang dirahmati Allah, marilah kita senantiasa meningkatkan ketakwaan kita kepada Allah SWT. Dalam kesempatan kali ini, materi yang kita angkat adalah mengenai "${judul}".`,
                        "Allah SWT mengingatkan kita dalam Al-Qur'an agar senantiasa menjaga keimanan dan tidak terpengaruh oleh fitnah duniawi yang sementara.",
                        "Mari kita jadikan momentum Jumat ini untuk mengintrospeksi diri, memperbaiki niat, dan meningkatkan amal shaleh dalam kehidupan sehari-hari."
                    ],
                    dalil: {
                        arab: "إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٦﴾ فَإِذَا فرَغْتَ فَانصَبْ ﴿٧﴾ وَإِلَىٰ رَبِّكَ فَارْغَب ﴿٨﴾",
                        latin: "Inna ma'al-'usri yusraa. Fa idzaa faraghta fanshab. Wa ilaa rabbika farghab.",
                        terjemahan: "Maka sesungguhnya bersama kesulitan ada kemudahan. Maka apabila engkau telah selesai (dari sesuatu urusan), tetaplah bekerja keras (untuk urusan yang lain), dan hanya kepada Tuhanmulah engkau berharap."
                    },
                    penutup: "بَارَكَ اللهُ لِي وَلَكُمْ فِي الْقُرْآنِ الْعَظِيْمِ، وَنَفَعَنِي وَإِيَّاكُمْ بِمَا فِيْهِ مِنَ الآيَاتِ وَالذِّكْرِ الْحَكِيْمِ. أَقُوْلُ قَوْلِي هَذَا وَأَسْتَغْفِرُ اللهَ الْعَظِيْمَ لِي وَلَكُمْ."
                },
                khotbah_kedua: {
                    muqaddimah: "الْحَمْدُ لِلَّهِ عَلَى إِحْسَانِهِ وَالشُّكْرُ لَهُ عَلَى تَوْفِيْقِهِ وَاِمْتِنَانِهِ. وَأَشْهَدُ أَنْ لاَ اِلَهَ إِلاَّ اللهُ وَاللهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ وَأَشْهَدُ أَنَّ سَيِّدَنَا مُحَمَّدً عَبْدُهُ وَرَسُوْلُهُ الدَّاعِى إِلَى رِضْوَانِهِ.",
                    wasiat_taqwa: "فَيَا أَيُّهَا النَّاسُ اِتَّقُوا اللهَ فِيْمَا أَمَرَ وَانْتَهُوْا عَمَّا نَهَى، وَاعْلَمُوْا أَنَّ اللهَ أَمَرَكُمْ بِأَمْرٍ بَدَأَ فِيْهِ بِنَفْسِهِ وَثَنَّى بِمَلآئِكَتِهِ بِقُدْسِهِ.",
                    doa: "اللَّهُمَّ اغْفِرْ لِلْمُسْلِمِيْنَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِيْنَ وَالْمُؤْمِنَاتِ الأَحْيَاءِ مِنْهُمْ وَالأَمْوَاتِ. اللَّهُمَّ أَعِزَّ الإِسْلاَمَ وَالْمُسْلِمِيْنَ، وَأَذِلَّ الشِّرْكَ وَالْمُشْرِكِيْنَ. رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ."
                }
            });
            globalIndex++;
        }
    }
    return db;
}

const khotbahDatabase = generate52Database();

// === LOGIKA PARSING DAN RENDER APLIKASI ===
function initDropdowns() {
    try {
        const selectBulan = document.getElementById('selectBulan');
        selectBulan.innerHTML = '';
        monthNames.forEach((name, index) => {
            const opt = document.createElement('option');
            opt.value = index + 1;
            opt.textContent = `Bulan ${index + 1}: ${name}`;
            selectBulan.appendChild(opt);
        });
        loadKhotbah();
    } catch (error) {
        console.error("Gagal menginisialisasi dropdown:", error);
    }
}

function getCurrentKhotbah() {
    try {
        const b = parseInt(document.getElementById('selectBulan').value) || 1;
        const m = parseInt(document.getElementById('selectMinggu').value) || 1;
        
        let found = khotbahDatabase.find(item => item.bulan === b && item.minggu === m);
        if (!found) {
            found = khotbahDatabase.find(item => item.bulan === b && item.minggu === 4) || khotbahDatabase[0];
        }
        return found;
    } catch (e) {
        console.error("Error fetching khotbah:", e);
        return khotbahDatabase[0];
    }
}

function renderHeaderInfo() {
    const khatib = document.getElementById('inputKhatib').value.trim();
    const masjid = document.getElementById('inputMasjid').value.trim();
    const displayIdentitas = document.getElementById('displayIdentitas');

    let text = "";
    if (khatib) text += `Khatib: ${khatib} `;
    if (masjid) text += `${khatib ? '| ' : ''}Masjid: ${masjid}`;
    displayIdentitas.textContent = text;
}

function loadKhotbah() {
    const data = getCurrentKhotbah();
    if (!data) return;

    document.getElementById('displayJudul').textContent = data.judul;
    document.getElementById('displayMeta').textContent = `Bulan ${data.bulan} | Minggu ke-${data.minggu}`;
    renderHeaderInfo();

    // Render Khotbah Pertama
    const k1 = data.khotbah_pertama || {};
    let htmlK1 = `
        <div class="section-title">Muqaddimah (Khotbah I)</div>
        <div class="arabic-text">${k1.muqaddimah || ''}</div>
        
        <div class="section-title">Wasiat Taqwa</div>
        <div class="arabic-text">${k1.wasiat_taqwa || ''}</div>

        <div class="section-title">Materi Utama</div>
        ${(k1.isi || []).map(p => `<p style="margin-bottom: 12px;">${p}</p>`).join('')}

        ${k1.dalil ? `
            <div class="section-title">Dalil Pendukung</div>
            <div class="arabic-text">${k1.dalil.arab}</div>
            <div class="latin-text">${k1.dalil.latin}</div>
            <div class="translation">" ${k1.dalil.terjemahan} "</div>
        ` : ''}

        <div class="section-title">Penutup Khotbah Pertama</div>
        <div class="arabic-text">${k1.penutup || ''}</div>
    `;
    document.getElementById('contentPertama').innerHTML = htmlK1;

    // Render Khotbah Kedua
    const k2 = data.khotbah_kedua || {};
    let htmlK2 = `
        <div class="section-title">Muqaddimah (Khotbah II)</div>
        <div class="arabic-text">${k2.muqaddimah || ''}</div>

        <div class="section-title">Wasiat Taqwa</div>
        <div class="arabic-text">${k2.wasiat_taqwa || ''}</div>

        <div class="section-title">Doa Penutup</div>
        <div class="arabic-text">${k2.doa || ''}</div>
    `;
    document.getElementById('contentKedua').innerHTML = htmlK2;
}

function switchTab(type) {
    const tabP = document.getElementById('tabPertama');
    const tabK = document.getElementById('tabKedua');
    const contentP = document.getElementById('contentPertama');
    const contentK = document.getElementById('contentKedua');

    if (type === 'pertama') {
        tabP.classList.add('active');
        tabK.classList.remove('active');
        contentP.style.display = 'block';
        contentK.style.display = 'none';
    } else {
        tabK.classList.add('active');
        tabP.classList.remove('active');
        contentK.style.display = 'block';
        contentP.style.display = 'none';
    }
}

function generatePdf() {
    try {
        const element = document.getElementById('printArea');
        const data = getCurrentKhotbah();
        
        // Memastikan kedua tab tampil saat cetak/PDF
        document.getElementById('contentPertama').style.display = 'block';
        document.getElementById('contentKedua').style.display = 'block';

        const opt = {
            margin:       10,
            filename:     `Khotbah_Jumat_Minggu_${data.minggu}_Bulan_${data.bulan}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            // Reset tab ke tampilan awal setelah PDF dibuat
            switchTab('pertama');
        });
    } catch (err) {
        alert("Gagal mengunduh PDF. Silakan gunakan tombol Cetak Khotbah.");
        console.error(err);
    }
}

// Initialize on Load
window.addEventListener('DOMContentLoaded', () => {
    initDropdowns();
});
</script>
